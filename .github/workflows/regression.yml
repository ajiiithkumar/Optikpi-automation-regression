name: OptiKPI Regression Tests

# Manual run. Regression, Campaign E2E and Workflow E2E are separate workflows; each has its own test
# logins (secrets USERS_CONFIG_JSON / USERS_CONFIG_CAMPAIGN_JSON / USERS_CONFIG_WORKFLOW_JSON), so they can run at
# the same time without sharing an account.
on:
  workflow_dispatch:

concurrency:
  group: optikpi-regression
  cancel-in-progress: false

jobs:
  regression-tests:
    name: Cucumber + Playwright - Audience & Campaign
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      HEADLESS: "true"
      PARALLEL_THREADS: "4"
      CI: "true"
      TZ: Asia/Kolkata

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium browser
        # The runner's default Ubuntu mirror (azure.archive.ubuntu.com) can be unreachable. Use the main
        # Ubuntu archive; if the system packages still cannot be installed, install only the browser
        # (downloaded from Playwright, not from Ubuntu).
        run: |
          sudo sed -i 's#http://azure.archive.ubuntu.com#http://archive.ubuntu.com#g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          timeout 600 npx playwright install --with-deps chromium || npx playwright install chromium

      - name: Create required directories
        run: mkdir -p data/users-config

      - name: Write .env from secret
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Write users config from secret
        run: echo '${{ secrets.USERS_CONFIG_JSON }}' > data/users-config/users.json

      - name: Reset test data
        # names.json is a runtime store; start every CI run clean so no stale audience/campaign names are used.
        run: echo '{}' > data/names.json

      - name: Run regression suite
        id: run-tests
        continue-on-error: true
        run: npm run test:tag -- "@Regression"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          retention-days: 14

      - name: Send Slack notification
        if: always() && env.SLACK_BOT_TOKEN != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          RUN_LABEL: "OptiKPI V2.0 Regression Test"
        run: npm run slack:report

      - name: Fail job if tests failed
        if: steps.run-tests.outcome == 'failure'
        run: exit 1
