name: OptiKPI Regression Tests

on:
  workflow_dispatch:

jobs:
  regression-tests:
    name: Cucumber + Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      HEADLESS: "true"
      PARALLEL_THREADS: "4"
      CI: "true"
      TZ: Asia/Kolkata

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Create required directories
        run: mkdir -p data/users-config

      - name: Write .env from secret
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Write users config from secret
        run: echo '${{ secrets.USERS_CONFIG_JSON }}' > data/users-config/users.json

      - name: Run full regression suite
        id: run-tests
        continue-on-error: true
        run: npm run test:parallel:continue

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          retention-days: 14

      - name: Send Slack notification
        if: always() && env.SLACK_BOT_TOKEN != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          RUN_LABEL: "OptiKPI V2.0 Regression Test"
        run: npm run slack:report

      - name: Fail job if tests failed
        if: steps.run-tests.outcome == 'failure'
        run: exit 1
